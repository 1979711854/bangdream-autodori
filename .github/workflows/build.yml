name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # softprops/action-gh-release 需要写权限;仓库默认为 read,不声明会 403
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-2022]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script
        run: |
          pip install pyinstaller
          python build.py --os ${{ runner.os }} --arch ${{ runner.arch }} --version ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # release 正文取仓库根的 RELEASE_NOTES.md —— 它只写**当前版本**的内容。
          # 不要用 CHANGELOG.md:那是全量历史,正文会带上所有旧版本条目。
          # 该文件由维护者在发版前手写,排版要求「每段一行、不按列折行」——
          # GitHub 会把单个换行渲染成 <br>,折行会让正文右侧出现大片空白。
          # (上游模板里的 evative7-changeloggen 步骤会覆写 CHANGELOG.md,已移除。)
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
